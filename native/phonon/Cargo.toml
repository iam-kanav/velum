[package]
name = "velum_phonon"
version = "0.1.0"
edition = "2024"
description = "C interface to the Phonon on-device voice (gradium-ai/xn-ptts) for Velum, on the CPU"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Text preparation, normalization and the tokenizer come with ptts, as in its own ptts-ffi.
ptts = { version = "=0.4.0", features = ["hf"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
