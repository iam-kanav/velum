name: velum
description: "Velum - A beautiful EPUB reader"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.8.1

dependencies:
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  go_router: ^17.0.0
  google_fonts: ^6.3.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  epubx: ^4.0.0
  webview_flutter: ^4.7.0
  file_picker: ^8.0.0+1
  permission_handler: ^11.3.1
  path_provider: ^2.1.2
  path: ^1.9.0
  edge_tts: ^0.1.4
  just_audio: ^0.9.43
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  html: ^0.15.5
  uuid: ^4.5.2
  google_mobile_ads: ^7.0.0
  intl: ^0.20.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_tts: ^4.2.5
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.11.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/android/play_store_512.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/android/play_store_512.png"



flutter:
  uses-material-design: true
  assets:
    - assets/icons/android/play_store_512.png
    - assets/js/
